<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dynamic Data Display Grid</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    margin: 0;
    padding: 20px;
}

h1 {
    text-align: center;
    color: #333;
}

.controls {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

input, select {
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 16px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
    gap: 20px;
}

.card {
    background: white;
    padding: 15px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,.2);
    transition: .3s;
}

.card:hover {
    transform: scale(1.03);
}

.card h2 {
    color: #0077cc;
    margin-bottom: 10px;
}

.loading {
    text-align: center;
    font-size: 20px;
}

.error {
    color: red;
    text-align: center;
}
</style>

</head>
<body>

<h1>Dynamic Data Display Grid</h1>

<div class="controls">

<input type="text" id="search" placeholder="Search Name">

<select id="sort">
<option value="">Sort</option>
<option value="az">A-Z</option>
<option value="za">Z-A</option>
</select>

<select id="city">
<option value="">All Cities</option>
</select>

</div>

<div id="status" class="loading">Loading Data...</div>

<div class="grid" id="grid"></div>

<script>

const api="https://jsonplaceholder.typicode.com/users";

let users=[];
let filtered=[];

const grid=document.getElementById("grid");
const search=document.getElementById("search");
const sort=document.getElementById("sort");
const city=document.getElementById("city");
const status=document.getElementById("status");

async function fetchUsers(){

try{

const response=await fetch(api);

if(!response.ok){
throw new Error("Error");
}

users=await response.json();

filtered=[...users];

status.style.display="none";

loadCities();

display(filtered);

}
catch{

status.innerHTML="<p class='error'>Failed to Load Data</p>";

}

}

function loadCities(){

const cities=[...new Set(users.map(user=>user.address.city))];

cities.forEach(c=>{

let option=document.createElement("option");

option.value=c;

option.textContent=c;

city.appendChild(option);

});

}

function display(data){

grid.innerHTML="";

data.forEach(user=>{

grid.innerHTML+=`

<div class="card">

<h2>${user.name}</h2>

<p><b>Username:</b> ${user.username}</p>

<p><b>Email:</b> ${user.email}</p>

<p><b>Phone:</b> ${user.phone}</p>

<p><b>Website:</b> ${user.website}</p>

<p><b>City:</b> ${user.address.city}</p>

<p><b>Company:</b> ${user.company.name}</p>

</div>

`;

});

}

function update(){

filtered=users.filter(user=>{

let name=user.name.toLowerCase().includes(search.value.toLowerCase());

let cityMatch=city.value==="" || user.address.city===city.value;

return name && cityMatch;

});

if(sort.value==="az"){

filtered.sort((a,b)=>a.name.localeCompare(b.name));

}

if(sort.value==="za"){

filtered.sort((a,b)=>b.name.localeCompare(a.name));

}

display(filtered);

}

search.addEventListener("input",update);

sort.addEventListener("change",update);

city.addEventListener("change",update);

fetchUsers();

</script>

</body>
</html>
